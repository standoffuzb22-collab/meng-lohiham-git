<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Veb-saytim</title>
    <style>
        /* CSS Uslublari */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .card h2 {
            color: #4a4a4a;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #6e8efb;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #5a7be0;
            transform: translateY(-2px);
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>Xush Kelibsiz!</h1>
    <p>Mening shaxsiy veb-sahifamga marhamat</p>
</header>

<main>
    <div class="card">
        <h2>Loyiha haqida</h2>
        <p>Bu HTML va CSS yordamida yaratilgan bitta yaxlit sahifa kodi. Kodlarni kompyuteringizdagi <code>index.html</code> fayliga saqlab, brauzerda ochishingiz mumkin.</p>
        <a href="#" class="btn">Batafsil</a>
    </div>
</main>

<footer>
    <p>&copy; 2026 Barcha huquqlar himoyalangan.</p>
</footer>

</body>
</html>
